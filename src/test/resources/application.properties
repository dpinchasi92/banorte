spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

server.port=8080
# Context path of the application.
server.servlet.context-path=/api/v1

application.title = online-banking-rest-api
application.version = 1.0.0

onlinebankingrestapi.jwt.security.app.key=ONLINEBANKINGRESTAPI
onlinebankingrestapi.jwt.security.expire.time=86400000

cbarkinozer.kafka.adddress=localhost:9092
cbarkinozer.kafka.topic=logs
cbarkinozer.kafka.group-id=onlinebankingrestapi
