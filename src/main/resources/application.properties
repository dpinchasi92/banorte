# Secrets must come from the environment (or a secrets manager); never commit them here.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/online-banking-rest-api}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

application.title = online-banking-rest-api
application.version = 1.0.0

server.port = 8080

# springdoc v2 defaults to OpenAPI 3.1; keep publishing 3.0 for existing API clients
springdoc.api-docs.version=openapi_3_0

logging.level.org.springframework = info

spring.jpa.show-sql = true
spring.jpa.hibernate.ddl-auto=create

onlinebankingrestapi.jwt.security.app.key=${JWT_SECRET}
onlinebankingrestapi.jwt.security.expire.time=86400000

cbarkinozer.kafka.adddress=localhost:9092
cbarkinozer.kafka.topic=logs
cbarkinozer.kafka.group-id=onlinebankingrestapi